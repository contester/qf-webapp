@(s: FullyDescribedSubmit)(implicit messages: Messages)

<tr><th scope="row"><a href="@routes.Application.showSubmit(s.submit.submitId.id)">@s.submit.submitId.id</a></th>
    <td>@s.submit.submitId.arrived.asString</td><td>@s.submit.submitId.problem.id</td><td>@s.index</td><td>@s.submit.submitId.ext</td>
    @if(s.result.success) {
    <td class="success" id="result-@{s.submit.submitId.id}">
        } else {
    <td id="result-@{s.submit.submitId.id}">
        }
        <a href="@routes.Application.showSubmit(s.submit.submitId.id)">@s.result.display</a></td>
    <td id="time-@{s.submit.submitId.id}">@if(!s.stats.timeLimitExceeded){ @s.stats.timeMs }</td><td  id="memory-@{s.submit.submitId.id}">@s.stats.memory</td></tr>
