@import org.stingray.contester.dbmodel._
@(contest: Contest, status: models.MonitorPoints)(implicit messages: Messages)

<html lang="@messages.lang.code">
<head>
    <meta charset="utf-8">
    <title>@contest.name</title>
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Roboto:300,400,500,700">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.5/css/bootstrap.min.css">
    <link href="//cdn.jsdelivr.net/bootstrap.material-design/0.5.10/css/bootstrap-material-design.min.css" rel="stylesheet">
</head><body><div class="container">
    <h3>@contest.name</h3>
    @contestinfoshort(contest)

    <div class="well">
    @monitortable(status, 0)
    </div>
</div></body></html>
